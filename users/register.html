<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masjid Kg. Bandulan – Register</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="login-screen" class="login-screen">
    <div class="login-card">

      <!-- Decorative geometric motif -->
      <div class="login-ornament">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <polygon points="40,4 76,22 76,58 40,76 4,58 4,22" fill="none" stroke="var(--gold)" stroke-width="2"/>
          <polygon points="40,14 66,28 66,52 40,66 14,52 14,28" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.5"/>
          <circle cx="40" cy="40" r="8" fill="var(--gold)" opacity="0.8"/>
        </svg>
      </div>

      <h1 class="login-title">Masjid Kg. Bandulan</h1>
      <p class="login-subtitle">Create Account</p>
      <p class="login-location">Kg. Bandulan, Sabah, Malaysia</p>

      <!-- Registration Form -->
      <div class="login-form">

        <!-- Personal Information -->
        <p class="form-section-label">Personal Information</p>

        <div class="input-row">
          <div class="input-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" placeholder="e.g. Ahmad" autocomplete="given-name" />
          </div>
          <div class="input-group">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" placeholder="e.g. Bin Ali" autocomplete="family-name" />
          </div>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="input-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+60 1X-XXX XXXX" autocomplete="tel" />
        </div>

        <div class="input-group">
          <label for="role">Role / Position</label>
          <select id="role">
            <option value="" disabled selected>Select your role</option>
            <option value="imam">Imam</option>
            <option value="bilal">Bilal</option>
            <option value="committee">Committee Member</option>
            <option value="volunteer">Volunteer</option>
            <option value="admin">Administrator</option>
            <option value="other">Other</option>
          </select>
        </div>

        <!-- Account Credentials -->
        <p class="form-section-label">Account Credentials</p>

        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" autocomplete="off" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Minimum 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)" />
          <div class="strength-bar">
            <span id="bar1"></span>
            <span id="bar2"></span>
            <span id="bar3"></span>
            <span id="bar4"></span>
          </div>
          <p class="strength-label" id="strength-label">Enter a password</p>
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter password" autocomplete="new-password" />
        </div>

        <!-- Messages -->
        <p id="reg-error" class="login-error hidden"></p>
        <p id="reg-success" class="success-msg hidden">Account created successfully! Redirecting to login…</p>

        <!-- Submit -->
        <button id="register-btn" class="btn btn-primary" onclick="handleRegister()">
          Create Account
        </button>

        <p class="register-link">
          Already have an account? <a href="/index.html">Sign in here</a>
        </p>
      </div>

      <p class="terms-note">
        By registering, you agree to the masjid's <a href="#">privacy policy</a> and <a href="#">terms of use</a>.
      </p>
    </div>
  </div>

  <script>
    /* ── Password strength checker ── */
    function checkStrength(val) {
      const bars = [1, 2, 3, 4].map(i => document.getElementById('bar' + i));
      const label = document.getElementById('strength-label');
      let score = 0;

      if (val.length >= 8)                        score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/\d/.test(val))                          score++;
      if (/[^A-Za-z0-9]/.test(val))               score++;

      const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#27ae60'];
      const labels = ['Weak', 'Fair', 'Good', 'Strong'];

      bars.forEach((b, i) => {
        b.style.background = i < score ? colors[score - 1] : '#d6cdb8';
      });
      label.textContent = val.length === 0 ? 'Enter a password' : labels[score - 1] || 'Weak';
      label.style.color = val.length === 0 ? 'var(--text-muted)' : colors[score - 1];
    }

    /* ── Registration handler ── */
    function handleRegister() {
      const firstName   = document.getElementById('first-name').value.trim();
      const lastName    = document.getElementById('last-name').value.trim();
      const email       = document.getElementById('email').value.trim();
      const phone       = document.getElementById('phone').value.trim();
      const role        = document.getElementById('role').value;
      const username    = document.getElementById('username').value.trim();
      const password    = document.getElementById('password').value;
      const confirmPwd  = document.getElementById('confirm-password').value;
      const errorEl     = document.getElementById('reg-error');
      const successEl   = document.getElementById('reg-success');

      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      // Validation
      if (!firstName || !lastName) return showError('Please enter your full name.');
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Please enter a valid email address.');
      if (!phone) return showError('Please enter your phone number.');
      if (!role) return showError('Please select your role.');
      if (!username || username.length < 3) return showError('Username must be at least 3 characters.');
      if (password.length < 8) return showError('Password must be at least 8 characters.');
      if (password !== confirmPwd) return showError('Passwords do not match.');

      // Send registration to backend
      const registerBtn = document.getElementById('register-btn');
      registerBtn.disabled = true;
      registerBtn.textContent = 'Creating Account...';

      fetch('http://localhost:5000/api/auth/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          firstName,
          lastName,
          email,
          phone,
          username,
          password,
          role: role || 'user'
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          showError(data.error);
          registerBtn.disabled = false;
          registerBtn.textContent = 'Create Account';
        } else {
          // Save token and user info
          localStorage.setItem('token', data.token);
          localStorage.setItem('userId', data.user.id);
          localStorage.setItem('userName', `${data.user.firstName} ${data.user.lastName}`);
          localStorage.setItem('userRole', data.user.role);
          localStorage.setItem('userEmail', data.user.email);

          successEl.textContent = 'Account created successfully! Redirecting to dashboard…';
          successEl.classList.remove('hidden');

          // Redirect based on role
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = '/admin/admin_dashboard.html';
            } else {
              window.location.href = '/users/dashboard.html';
            }
          }, 2000);
        }
      })
      .catch(error => {
        showError('An error occurred. Please try again.');
        console.error('Registration error:', error);
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
      });
    }

    function showError(msg) {
      const errorEl = document.getElementById('reg-error');
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleRegister();
    });
  </script>
</body>
</html>
