<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masjid Kg. Bandulan – Login</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Google Fonts: Amiri (Arabic-inspired serif) + Nunito Sans (clean body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
  ============================================================ -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <!-- Decorative geometric motif -->
      <div class="login-ornament">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <polygon points="40,4 76,22 76,58 40,76 4,58 4,22" fill="none" stroke="var(--gold)" stroke-width="2"/>
          <polygon points="40,14 66,28 66,52 40,66 14,52 14,28" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.5"/>
          <circle cx="40" cy="40" r="8" fill="var(--gold)" opacity="0.8"/>
        </svg>
      </div>

      <h1 class="login-title">Masjid Kg. Bandulan</h1>
      <p class="login-subtitle">Administration System</p>
      <p class="login-location">Kg. Bandulan, Sabah, Malaysia</p>

      <!-- Login Form -->
      <div class="login-form">
        <!-- Username input -->
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" autocomplete="off" />
        </div>

        <!-- Password input -->
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" />
        </div>

        <!-- Error message (shown on wrong credentials) -->
        <p id="login-error" class="login-error hidden">Invalid username or password.</p>

        <!-- Login button -->
        <button id="login-btn" class="btn btn-primary" onclick="handleLogin()">
          Sign In
        </button>

        <!-- Register link -->
        <p class="register-link">
         New user? <a href="users/register.html">Create an account</a>
        </p>
      </div>

      <p class="login-hint">Demo Admin: <strong>admin</strong> / <strong>1234</strong><br />Demo User: <strong>demo</strong> / <strong>1234</strong></p>
    </div>
  </div>

  <script>
    const DEMO_USERS = {
      admin: {
        username: 'admin',
        password: '1234',
        role: 'admin',
        displayName: 'Admin',
        email: 'admin@example.com',
      },
      demo: {
        username: 'demo',
        password: '1234',
        role: 'user',
        displayName: 'Demo User',
        email: 'demo@example.com',
      }
    };

    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('login-error');
      const loginBtn = document.getElementById('login-btn');

      errorMsg.classList.add('hidden');

      if (!username || !password) {
        errorMsg.textContent = 'Please enter username and password.';
        errorMsg.classList.remove('hidden');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      const user = Object.values(DEMO_USERS).find(u => u.username === username && u.password === password);
      if (!user) {
        errorMsg.textContent = 'Invalid username or password.';
        errorMsg.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        return;
      }

      localStorage.setItem('token', 'local-demo-token');
      localStorage.setItem('userName', user.displayName);
      localStorage.setItem('userRole', user.role);
      localStorage.setItem('userEmail', user.email);
      localStorage.setItem('userId', user.username);

      if (user.role === 'admin') {
        window.location.href = '/admin/admin_dashboard.html';
      } else {
        window.location.href = '/users/dashboard.html';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html></content>
