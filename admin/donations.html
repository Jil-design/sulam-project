<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masjid Kg. Bandulan – Donations</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Google Fonts: Amiri (Arabic-inspired serif) + Nunito Sans (clean body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ============================================================
       MAIN APP (Donations)
  ============================================================ -->
  <div id="app" class="app">

    <!-- ---- SIDEBAR NAVIGATION ---- -->
    <aside class="sidebar">
      <!-- Mosque branding -->
      <div class="sidebar-header">
        <div class="sidebar-icon">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
            <!-- Simple mosque dome icon -->
            <ellipse cx="20" cy="22" rx="14" ry="10" fill="var(--gold)" opacity="0.9"/>
            <rect x="6" y="22" width="28" height="10" rx="2" fill="var(--teal-dark)"/>
            <rect x="18" cy="10" width="4" height="12" fill="var(--teal-dark)"/>
            <ellipse cx="20" cy="10" rx="6" ry="4" fill="var(--gold)"/>
            <rect x="8" y="28" width="4" height="6" rx="1" fill="var(--gold)" opacity="0.6"/>
            <rect x="28" y="28" width="4" height="6" rx="1" fill="var(--gold)" opacity="0.6"/>
          </svg>
        </div>
        <div>
          <h2 class="sidebar-title">Masjid Kg. Bandulan</h2>
          <p class="sidebar-sub">Kg. Bandulan, Sabah</p>
        </div>
      </div>

      <!-- Navigation links -->
      <nav class="sidebar-nav">
        <a href="admin_dashboard.html" class="nav-item">
          <span class="nav-icon">🏠</span> Dashboard
        </a>
        <a href="prayer.html" class="nav-item">
          <span class="nav-icon">🕌</span> Prayer Times
        </a>
        <a href="announcements.html" class="nav-item">
          <span class="nav-icon">📢</span> Announcements
        </a>
        <a href="donations.html" class="nav-item active">
          <span class="nav-icon">💰</span> Donations
        </a>
      </nav>

      <!-- Logout button at bottom of sidebar -->
      <div class="sidebar-footer">
        <button class="btn btn-outline-light" onclick="handleLogout()">Sign Out</button>
      </div>
    </aside>


    <!-- ---- MAIN CONTENT AREA ---- -->
    <main class="main-content">

      <!-- Top bar -->
      <header class="topbar">
        <h2 id="section-title" class="topbar-title">Donations</h2>
        <div class="topbar-right">
          <span id="current-date" class="topbar-date"></span>
          <span class="topbar-admin">👤 Admin</span>
        </div>
      </header>


      <!-- ==================================================
           SECTION: DONATION ANALYTICS
      ================================================== -->
      <section id="section-donations" class="section active">

        <!-- Analytics controls -->
        <div class="card">
          <div class="card-header">
            <h3>📊 Donation Analytics</h3>
          </div>
          <div class="analytics-controls">
            <div class="filter-group">
              <label>Time Period:</label>
              <select id="analytics-period" onchange="loadAnalytics()">
                <option value="week">This Week</option>
                <option value="month" selected>This Month</option>
                <option value="year">This Year</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Analytics summary cards -->
        <div class="stats-row">
          <div class="stat-card green">
            <div class="stat-icon">💰</div>
            <div>
              <p class="stat-label">Total Donations</p>
              <p class="stat-value" id="analytics-total">RM 0.00</p>
            </div>
          </div>
          <div class="stat-card teal">
            <div class="stat-icon">📈</div>
            <div>
              <p class="stat-label">Number of Donations</p>
              <p class="stat-value" id="analytics-count">0</p>
            </div>
          </div>
          <div class="stat-card gold">
            <div class="stat-icon">📊</div>
            <div>
              <p class="stat-label">Average Donation</p>
              <p class="stat-value" id="analytics-average">RM 0.00</p>
            </div>
          </div>
        </div>

        <!-- Recent donations -->
        <div class="card">
          <div class="card-header">
            <h3>📜 Recent User Donations</h3>
          </div>
          <div id="analytics-donations">
            <p class="empty-state">Loading donation analytics...</p>
          </div>
        </div>

      </section>

    </main>
  </div>

  <!-- Link the JavaScript file -->
  <script src="/js/script.js"></script>
  <script>
    const API_URL = 'http://localhost:5000/api';

    function getAuthHeaders() {
      const token = localStorage.getItem('token');
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    async function loadAnalytics() {
      const period = document.getElementById('analytics-period').value;
      const totalEl = document.getElementById('analytics-total');
      const countEl = document.getElementById('analytics-count');
      const averageEl = document.getElementById('analytics-average');
      const donationsEl = document.getElementById('analytics-donations');

      try {
        const response = await fetch(`${API_URL}/donations/analytics?period=${period}`, {
          headers: getAuthHeaders(),
        });
        const data = await response.json();

        if (response.ok) {
          totalEl.textContent = `RM ${data.total.toFixed(2)}`;
          countEl.textContent = data.count;
          averageEl.textContent = `RM ${data.average.toFixed(2)}`;

          if (data.donations.length === 0) {
            donationsEl.innerHTML = '<p class="empty-state">No donations found for this period.</p>';
          } else {
            donationsEl.innerHTML = data.donations.slice(0, 10).map(donation => `
              <div class="donation-history-item">
                <div>
                  <span class="donation-amount-pos">+ RM ${Number(donation.amount).toFixed(2)}</span>
                  <span class="donation-note-txt">– ${donation.note || 'Donation'}</span>
                </div>
                <span class="donation-date">${new Date(donation.created_at).toLocaleDateString()}</span>
              </div>
            `).join('');
          }
        } else {
          donationsEl.innerHTML = '<p class="empty-state">Unable to load analytics.</p>';
        }
      } catch (error) {
        console.error('Error loading analytics:', error);
        donationsEl.innerHTML = '<p class="empty-state">Unable to load analytics.</p>';
      }
    }

    // Override handleLogout for donations page to redirect to login
    function handleLogout() {
      window.location.href = '/index.html';
    }

    // Load analytics on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadAnalytics();
    });
  </script>
</body>
</html></content>
