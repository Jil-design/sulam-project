<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masjid Kg Tobobon – Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Google Fonts: Amiri (Arabic-inspired serif) + Nunito Sans (clean body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
  ============================================================ -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <!-- Decorative geometric motif -->
      <div class="login-ornament">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <polygon points="40,4 76,22 76,58 40,76 4,58 4,22" fill="none" stroke="var(--gold)" stroke-width="2"/>
          <polygon points="40,14 66,28 66,52 40,66 14,52 14,28" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.5"/>
          <circle cx="40" cy="40" r="8" fill="var(--gold)" opacity="0.8"/>
        </svg>
      </div>

      <h1 class="login-title">Masjid Kg Tobobon</h1>
      <p class="login-subtitle">Administration System</p>
      <p class="login-location">Kg Tobobon, Sabah, Malaysia</p>

      <!-- Login Form -->
      <div class="login-form">
        <!-- Username input -->
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" autocomplete="off" />
        </div>

        <!-- Password input -->
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" />
        </div>

        <!-- Error message (shown on wrong credentials) -->
        <p id="login-error" class="login-error hidden">Invalid username or password.</p>

        <!-- Login button -->
        <button id="login-btn" class="btn btn-primary" onclick="handleLogin()">
          Sign In
        </button>
      </div>

      <p class="login-hint">Demo: <strong>admin</strong> / <strong>1234</strong></p>
    </div>
  </div>

  <script>
    // Simple login handler for login page
    function handleLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('login-error');

      if (username === 'admin' && password === '1234') {
        // Successful login, redirect to dashboard
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.classList.remove('hidden');
      }
    }
  </script>
</body>
</html></content>
